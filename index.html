    <title>BOYZ N THE HOOD — $BOYZ</title>
    <style>
      html { background: #0a0d1a; }

      /* ===== loading splash ===== */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #070912;
        transition: opacity .8s ease, visibility .8s;
      }
      #splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash .glow {
        position: absolute; width: 62vmin; height: 62vmin; border-radius: 50%;
        background: radial-gradient(circle, rgba(213,252,4,.25) 0%, rgba(166,210,19,.12) 38%, transparent 70%);
        filter: blur(50px);
        animation: splash-pulse 2.6s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,100% { transform: scale(1); opacity: .85; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      #splash .lockup { position: relative; text-align: center; }
      #splash .word-logo {
        width: min(420px, 70vw);
        opacity: 0;
        filter: drop-shadow(0 6px 24px rgba(213,252,4,.35));
        animation: splash-rise .8s cubic-bezier(.2,.7,.2,1) .1s forwards;
      }
      #splash .sub {
        font-family: Anton, "Arial Narrow", Impact, sans-serif;
        font-size: clamp(15px, 3vw, 26px); letter-spacing: .58em; text-indent: .58em;
        color: rgba(255,243,214,.85); margin-top: 14px;
        opacity: 0; animation: splash-rise .8s cubic-bezier(.2,.7,.2,1) .65s forwards;
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(22px); }
        to { opacity: 1; transform: translateY(0); }
      }
      #splash .bar {
        width: min(240px, 50vw); height: 2px; margin-top: 42px; border-radius: 2px;
        background: rgba(255,255,255,.10); overflow: hidden;
        opacity: 0; animation: splash-rise .6s ease .8s forwards;
      }
      #splash .bar i {
        display: block; height: 100%; width: 0%;
        background: linear-gradient(90deg, #d5fc04, #f6fa3e, #a6d213);
        border-radius: 2px;
        animation: splash-fill 2.1s cubic-bezier(.3,.6,.4,1) .5s forwards;
      }
      @keyframes splash-fill { to { width: 100%; } }
      #splash.done .lockup { transition: transform .7s ease, filter .7s ease; transform: translateY(-26px) scale(1.04); filter: blur(10px); }
      #splash.done .bar { transition: opacity .4s; opacity: 0 !important; }
    </style>
    <script type="module" crossorigin src="./assets/index-DXrWF2OZ.js"></script>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="glow"></div>
      <div class="lockup">
        <img class="word-logo" src="./boyz-logo.png" alt="BOYZ" />
        <div class="sub">N THE HOOD</div>
      </div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script>
      /* hard fallback: never leave the splash up if something goes wrong */
      setTimeout(function () {
        var s = document.getElementById("splash");
        if (s) s.classList.add("done");
      }, 7000);
    </script>
  </body>
